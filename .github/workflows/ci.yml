# Contract + API checks, and a type check of the Expo app. apps/mobile is
# outside the pnpm workspace (yarn 1, Expo 50), so it has its own job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: everbloom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/everbloom_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/everbloom_test?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @everbloom/contract typecheck
      - run: pnpm --filter @everbloom/api typecheck
      - run: pnpm --filter @everbloom/api lint
      - run: pnpm --filter @everbloom/admin typecheck
      - run: pnpm --filter @everbloom/admin build
      - run: pnpm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/mobile/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn ts:check --noEmit
